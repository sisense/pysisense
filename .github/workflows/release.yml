name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get package version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if version tag already exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping release."

      - name: Install build tools
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Build package
        if: steps.tag_check.outputs.exists == 'false'
        run: uv build

      - name: Publish to PyPI
        if: steps.tag_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

      - name: Create Git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prefer the CHANGELOG section for this version; fall back to
          # auto-generated commit notes so a release is never left with an
          # empty body.
          if awk -v ver="${{ steps.version.outputs.version }}" \
               '/^## \[/ {p = ($0 ~ "\\[" ver "\\]")} p' CHANGELOG.md | grep -q .; then
            awk -v ver="${{ steps.version.outputs.version }}" \
              '/^## \[/ {p = ($0 ~ "\\[" ver "\\]")} p' CHANGELOG.md > /tmp/release-notes.md
            gh release create ${{ steps.version.outputs.tag }} \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create ${{ steps.version.outputs.tag }} \
              --title "${{ steps.version.outputs.tag }}" \
              --generate-notes
          fi
