domain: ""                # IP address or hostname — no protocol, no port
is_ssl: true              # true for HTTPS (port 443), false for HTTP (default port 30845)
# port: 30845             # optional, HTTP port when is_ssl is false (omit to use 30845)
token: ""                 # Sisense Admin API token
# operating_system: linux  # "linux" (default) or "windows" — controls OS-specific API endpoints
# verify_ssl: false        # verify the server's TLS certificate; defaults to true — only disable for trusted networks with self-signed certs
